<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naoya Yamamoto — AI Chat</title>
  <meta name="description" content="Naoya YamamotoのAIチャット。">

  <!-- OGP -->
  <meta property="og:title" content="Naoya Yamamoto — AI Chat">
  <meta property="og:description" content="Naoya YamamotoのAIチャット。">
  <meta property="og:image" content="images/naoya_avatar.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Manrope:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">

  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="page">
    <header class="identity">
      <div class="avatar">
        <img src="images/naoya_avatar.jpg" alt="山本 直哉のプロフィール写真" width="96" height="96">
      </div>
      <div class="identity-text">
        <p class="name">Naoya Yamamoto</p>
        <p class="sub">AI Chat</p>
      </div>
    </header>

    <section class="chat-section" id="ai-chat" aria-label="AI chat">
      <div class="chat-container" id="chatContainer">
        <div class="chat-messages" id="chatMessages">
          <div class="chat-message ai-message">
            <div class="chat-avatar-ai">
              <img src="images/naoya_avatar.jpg" alt="Naoya avatar" width="34" height="34">
            </div>
            <div class="chat-bubble">
              <p>こんにちは。山本直哉について何でも聞いてください。</p>
            </div>
          </div>
        </div>
        <form class="chat-input-area" id="chatForm" autocomplete="off">
          <label class="chat-label" for="chatInput">メッセージ</label>
          <div class="chat-input-row">
            <input id="chatInput" class="chat-input" type="text" placeholder="Enterで送信" autocomplete="off" />
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="js/chat.js"></script>
</body>

</html>

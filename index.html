<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naoya Yamamoto | Press Style</title>
  <meta name="description" content="Naoya Yamamoto AGI portfolio in press style UI." />
  <meta property="og:title" content="Naoya Yamamoto | Press Style" />
  <meta property="og:description" content="AGI, Chat, and Links" />
  <meta property="og:image" content="images/naoya_avatar.jpg" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body id="top">
  <main class="page">
    <div class="page-inner">
      <header class="page-header">
        <div class="profile-wrap">
          <img src="images/naoya_avatar.jpg" alt="Naoya Yamamoto" width="70" height="70" class="avatar" />
          <h1 class="name"><a href="#top">山本直哉</a></h1>
        </div>
        <nav class="top-nav">
          <a href="#agi" class="nav-link active">AGI</a>
          <a href="#chat" class="nav-link">Chat</a>
          <a href="#links" class="nav-link">Links</a>
        </nav>
      </header>

      <section id="agi" class="content-section">
        <div class="section-body text-lg">
          <p class="plain-lead">AGI</p>
        </div>
      </section>

      <section id="chat" class="content-section">
        <div class="chat-container" id="chatContainer">
          <div class="chat-messages" id="chatMessages"></div>

          <div class="chat-input-area">
            <div class="chat-suggestions" id="chatSuggestions">
              <button class="suggestion-chip" data-query="AGIはいつ実用化される？">AGIはいつ実用化される？</button>
              <button class="suggestion-chip" data-query="AIエージェントの作り方は？">AIエージェントの作り方は？</button>
            </div>

            <form class="chat-form" id="chatForm">
              <input id="chatInput" class="chat-input" type="text" placeholder="AGIについて質問する" autocomplete="off" />
              <button id="chatSend" class="chat-send" type="submit" aria-label="送信">
                <i class="fas fa-paper-plane"></i>
              </button>
            </form>
          </div>
        </div>
      </section>

      <section id="links" class="content-section">
        <div class="section-body text-lg">
          <ul class="press-list">
            <li class="press-item">
              <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a>
              <div class="meta">Profile</div>
            </li>
            <li class="press-item">
              <a href="https://www.linkedin.com/in/naoya-yamamoto-a21a31371/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
              <div class="meta">Profile</div>
            </li>
            <li class="press-item">
              <a href="mailto:naoya.ado1dem@gmail.com">naoya.ado1dem@gmail.com</a>
              <div class="meta">Email</div>
            </li>
          </ul>
        </div>
      </section>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
